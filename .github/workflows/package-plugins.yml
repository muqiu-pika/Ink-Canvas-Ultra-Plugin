name: Package Plugins

on:
  # 手动触发
  workflow_dispatch:
  # 推送到 main 时自动打包（产物以 Artifact 形式提供，不写回仓库）
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/plugin.icplugin'
      - '.github/workflows/package-plugins.yml'
  # 发布 Release 时把打包结果作为资产附到 Release
  release:
    types: [published]

# release 事件需要把打包产物作为资产附到 Release，故授予 contents: write。
# 本工作流任何步骤都不会 git commit/push 回仓库（push 事件仅上传 Artifact，不写回源码），
# 因此"保留仓库里已打包好的插件"的约定仍然成立——CI 产物只进 build-output/ 与 Release 资产，不覆盖源码树中的 .icplugin。
permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # 主程序（ICU）引用程序集所在目录，用于解析插件 csproj 中硬编码的 HintPath。
  # CI 默认没有本机路径，需在仓库 Secrets 中配置 INKCANVAS_LIB_PATH 指向包含
  # "Ink Canvas Ultra.exe" 及其依赖 DLL 的目录（可由 ICU 的 Release 构建产物提供）。
  # 未配置时插件构建会失败（下面会记录警告并继续，不影响工作流其它步骤）。
  INKCANVAS_LIB_PATH: ${{ secrets.INKCANVAS_LIB_PATH }}

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET SDK (for dotnet build of net472 SDK-style projects)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Ink Canvas Ultra (main program reference)
        shell: pwsh
        run: |
          # 若外部已提供有效的主程序引用目录（Secret INKCANVAS_LIB_PATH），直接复用，跳过构建。
          if ($env:INKCANVAS_LIB_PATH -and (Test-Path $env:INKCANVAS_LIB_PATH)) {
            Write-Host "::notice::使用外部 INKCANVAS_LIB_PATH=$env:INKCANVAS_LIB_PATH，跳过主程序构建"
            exit 0
          }

          # 插件 csproj 硬编码了本机路径，CI 上没有该路径的 exe，只能现场构建主程序。
          # 主程序仓库在 https://github.com/muqiu-pika/Ink-Canvas-Ultra，构建后其 bin\Release 即作为插件引用目录。
          # 注意：主程序使用了 COM 引用（IWshRuntimeLibrary/stdole），dotnet build（.NET Core MSBuild）会报
          # MSB4803“不支持 ResolveComReference”，必须用 .NET Framework 版本 MSBuild（windows-latest 上随 VS 预装）。
          $refRepo = Join-Path $env:TEMP "icu-reference"
          if (Test-Path $refRepo) { Remove-Item -Recurse -Force $refRepo }
          Write-Host "==> 未配置 INKCANVAS_LIB_PATH，克隆并构建 Ink Canvas Ultra 作为插件引用..."
          try {
            git clone --depth 1 --quiet "https://github.com/muqiu-pika/Ink-Canvas-Ultra.git" $refRepo
            Push-Location (Join-Path $refRepo "Ink Canvas")
            try {
              # 定位 .NET Framework 版 MSBuild（可解析 COM 引用）。windows-latest 通常已在 PATH，
              # 若没有则通过 vswhere 查找 VS 安装。
              $msbuild = (Get-Command msbuild.exe -ErrorAction SilentlyContinue).Source
              if (-not $msbuild) {
                $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
                if (Test-Path $vswhere) {
                  $vsDir = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath 2>$null
                  if ($vsDir) {
                    $c = Join-Path $vsDir "MSBuild\Current\Bin\MSBuild.exe"
                    if (Test-Path $c) { $msbuild = $c }
                  }
                }
              }
              if (-not $msbuild) { throw "MSBuild not found" }
              # 全新 clone 没有 obj，必须先 Restore 再 Build，否则报“Assets file not found”。
              & $msbuild "Ink Canvas.csproj" /t:Restore,Build /p:Configuration=Release /p:Platform=AnyCPU /m /nologo /v:m
              if ($LASTEXITCODE -ne 0) { throw "main build failed with exit $LASTEXITCODE" }
              $libOut = Join-Path (Get-Location) "bin\Release"
              if (Test-Path (Join-Path $libOut "Ink Canvas Ultra.exe")) {
                "INKCANVAS_LIB_PATH=$libOut" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Host "::notice::主程序已构建，插件引用目录: $libOut"
              } else {
                Write-Host "::warning::主程序构建完成但未找到 exe，插件将因引用缺失而失败"
              }
            } finally { Pop-Location }
          } catch {
            Write-Host "::warning::主程序构建失败: $($_.Exception.Message)"
          }

      - name: Build & package every plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $repoRoot = $PWD
          $buildOutput = Join-Path $repoRoot "build-output"
          if (Test-Path $buildOutput) { Remove-Item -Recurse -Force $buildOutput }
          New-Item -ItemType Directory -Force -Path $buildOutput | Out-Null

          # 发现所有“含 csproj 且含 plugin.icplugin 清单”的插件目录（排除 bin/obj/Templates/market）
          $csprojs = Get-ChildItem -Path $repoRoot -Recurse -Filter *.csproj |
            Where-Object {
              $_.FullName -notmatch '\\(bin|obj)\\' -and
              $_.FullName -notmatch '\\Templates\\' -and
              $_.FullName -notmatch '\\market\\'
            }

          $built = 0
          $failed = 0

          foreach ($csproj in $csprojs) {
            $dir = $csproj.DirectoryName
            $manifest = Join-Path $dir "plugin.icplugin"
            if (-not (Test-Path $manifest)) {
              Write-Host "::notice::跳过 $($csproj.Name)（缺少 plugin.icplugin 清单）"
              continue
            }

            Write-Host "==> 处理插件目录: $dir"

            # 将 csproj 中硬编码的本机 HintPath 替换为 CI 可用的主程序引用目录。
            # 各插件的写法不统一：有的用 bin\Debug，有的用 bin\Release，有的用 obj\Debug，
            # 大小写也可能不同（VideoControlsPlugin.csproj 用小写 'c:\'）。因此按“整个磁盘路径 +
            # \Ink Canvas\(bin|obj)\(Debug|Release)\”整体匹配，替换为目标目录，与具体本机路径无关。
            $lib = $env:INKCANVAS_LIB_PATH
            if ($lib -and (Test-Path $lib)) {
              $txt = Get-Content $csproj.FullName -Raw
              $txt = [regex]::Replace(
                $txt,
                '(?i)[a-z]:\\.*\\Ink Canvas\\(?:bin|obj)\\(?:Debug|Release)\\',
                { param($m) ($lib + '\') })
              Set-Content -Path $csproj.FullName -Value $txt -Encoding UTF8
              Write-Host "   已重写 HintPath -> $lib"
            } else {
              Write-Host "::warning::未配置 INKCANVAS_LIB_PATH，插件可能因无法解析主程序引用而构建失败"
            }

            # 构建（Release）。构建失败仅记录，不中断其它插件
            Push-Location $dir
            try {
              dotnet build $csproj.Name -c Release --nologo
              if ($LASTEXITCODE -ne 0) { throw "dotnet build exit $LASTEXITCODE" }
            } catch {
              Write-Host "::warning::插件 $($csproj.Name) 构建失败: $_"
              $failed++
              Pop-Location
              continue
            }
            Pop-Location

            # 定位构建输出目录（OutputPath=bin\，可能带/不带 Release 子目录）
            $bin = Join-Path $dir "bin"
            $out = if (Test-Path (Join-Path $bin "Release")) { Join-Path $bin "Release" }
                   elseif (Test-Path $bin) { $bin }
                   elseif (Test-Path (Join-Path $bin "Debug")) { Join-Path $bin "Debug" }
                   else { $null }

            if (-not $out -or -not (Test-Path (Join-Path $out "$($csproj.BaseName).dll"))) {
              Write-Host "::warning::插件 $($csproj.Name) 未找到构建产物 DLL，跳过打包"
              $failed++
              continue
            }

            # 暂存：manifest + 所有 DLL（含 NPOI / PdfiumViewer 等依赖），再压缩为 .icplugin
            $stage = Join-Path $env:TEMP ("icplugin_" + [guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item -Force $manifest $stage
            Get-ChildItem $out -Filter *.dll | Copy-Item -Destination $stage -Force

            $pkgName = $csproj.Directory.Name + ".icplugin"
            $zip = Join-Path $buildOutput $pkgName
            if (Test-Path $zip) { Remove-Item -Force $zip }
            Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
            Remove-Item -Recurse -Force $stage

            Write-Host "::notice::已打包: $pkgName"
            $built++
          }

          Write-Host "==> 完成：成功 $built 个，失败 $failed 个"
          if ($failed -gt 0) {
            Write-Host "::warning::有 $failed 个插件未能打包（多为 INKCANVAS_LIB_PATH 未配置或主程序引用缺失）"
          }

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: build-output/*.icplugin
          if-no-files-found: warn

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.icplugin
