name: Deploy Market to EdgeOne

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'market/**'
      - '.github/workflows/deploy-market.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: Install edgeone CLI
        run: npm install -g edgeone

      - name: Deploy to EdgeOne Pages
        run: edgeone makers deploy ./market -n icu-market -t ${{ secrets.EDGEONE_API_TOKEN }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
